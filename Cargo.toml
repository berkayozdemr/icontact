[workspace]
members = ["crates/ec-core", "crates/ec-capture", "crates/ec-vision", "crates/ec-cli", "crates/ec-app"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
ec-core = { path = "crates/ec-core" }
ec-capture = { path = "crates/ec-capture" }
ec-vision = { path = "crates/ec-vision" }

[profile.release]
opt-level = 3
lto = "thin"
